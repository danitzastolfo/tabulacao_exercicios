<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Exemplo 2: Tabelas</title>
    </head>
    <body>
        <header>
            <h1 style="text-align: center; color: red;">Almoço do SESI</h1>
            <hr>
        </header>
        <main>
            <table border="1" style="width: 100%;"> <!-- abertura da tabela -->
                <caption>Comidas do SESI</caption> <!-- título da tabela -->
                    <thead>
                        <tr>
                            <th colspan="6">Dias da Semana</th>
                        </tr>
                        <tr>
                            <th>Informações</th>
                            <th>Segunda-feira</th>
                            <th>Terça-feira</th>
                            <th>Quarta-feira</th>
                            <th>Quinta-feira</th>
                            <th>Sexta-feira</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td rowspan="2" style="background-image: url'https://media.istockphoto.com/id/157373207/pt/foto/pedras-seixo-de-equil%C3%ADbrio-numa-praia-durante-o-p%C3%B4r-do-sol.jpg?s=612x612&w=0&k=20&c=Dr0EC4zTDog__QLGwDyadphWXZCDyzx_FXAeis1iKkM=';">Informações Nutricionais</td>
                            <td colspan="5" style="text-align: center;">
                                <b>Arroz + Feijão</b></td>
                        </tr>
                        <tr>
                            <td>Carne de porco</td>
                            <td>Fricassê</td>
                            <td>Goulash</td>
                            <td>Omelete</td>
                            <td>Filé de frango</td>
                        </tr>
                    </tbody>
            </table>
        </main>
    </body>
</html>
